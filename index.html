<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B2E22" />

    <title>Arte de Amar · ONG em Palmas, Tocantins</title>
    <meta
      name="description"
      content="Organização da sociedade civil de Palmas, Tocantins. Desde 2015 acompanhamos crianças e famílias em vulnerabilidade com campanhas, voluntários e parceiros."
    />

    <!-- domínio do Cloudflare Pages; trocar se a ONG registrar um próprio -->
    <link rel="canonical" href="https://arte-de-amar-site.pages.dev/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Arte de Amar" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Arte de Amar · ONG em Palmas, Tocantins" />
    <meta
      property="og:description"
      content="Desde 2015 espalhando amor e construindo um mundo melhor em Palmas, Tocantins."
    />
    <meta property="og:url" content="https://arte-de-amar-site.pages.dev/" />
    <meta property="og:image" content="https://arte-de-amar-site.pages.dev/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Menino sorrindo com sua mochila nova, com o logo da Arte de Amar" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Arte de Amar · ONG em Palmas, Tocantins" />
    <meta
      name="twitter:description"
      content="Desde 2015 espalhando amor e construindo um mundo melhor em Palmas, Tocantins."
    />
    <meta name="twitter:image" content="https://arte-de-amar-site.pages.dev/og-image.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/logo/coracao-fill.svg" />

    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/fontes/Sentient-300.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/fontes/Switzer-400.woff2"
      crossorigin
    />
    <!--
      O hero é o LCP. O preload usa o mesmo srcset e sizes do <picture>, para
      o navegador baixar exatamente a largura que vai mostrar, e não a maior.
    -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/assets/fotos/gerado/hero-menino-mochila-960.webp"
      imagesrcset="
        /assets/fotos/gerado/hero-menino-mochila-400.webp 400w,
        /assets/fotos/gerado/hero-menino-mochila-640.webp 640w,
        /assets/fotos/gerado/hero-menino-mochila-960.webp 960w,
        /assets/fotos/gerado/hero-menino-mochila-1280.webp 1280w,
        /assets/fotos/gerado/hero-menino-mochila-1600.webp 1600w"
      imagesizes="(min-width: 1024px) 48vw, 100vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
